<h1 style="margin: 0 0 16px 0; color: #ffffff; font-size: 24px; font-weight: 600;">
  Your subscription has been renewed
</h1>
<p style="margin: 0 0 24px 0; color: #a1a1aa; font-size: 16px; line-height: 1.6;">
  Hey {{USER_NAME}}, your <strong style="color: #4F47E6;">{{PLAN_NAME}}</strong> subscription for <strong style="color: #ffffff;">{{TEAM_NAME}}</strong> has been successfully renewed.
</p>

<div style="background-color: #16161f; border-radius: 8px; padding: 20px; margin-bottom: 24px; border: 1px solid #27272a;">
  <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
    <tr>
      <td style="color: #a1a1aa; font-size: 14px; padding-bottom: 8px;">Amount charged</td>
      <td style="color: #ffffff; font-size: 14px; font-weight: 600; text-align: right; padding-bottom: 8px;">{{AMOUNT}}</td>
    </tr>
    <tr>
      <td style="color: #a1a1aa; font-size: 14px;">Next renewal</td>
      <td style="color: #ffffff; font-size: 14px; font-weight: 600; text-align: right;">{{RENEWAL_DATE}}</td>
    </tr>
  </table>
</div>

<div style="text-align: center; margin-bottom: 24px;">
  <a href="{{MANAGE_URL}}" style="display: inline-block; padding: 14px 32px; background-color: #4F47E6; color: #ffffff; text-decoration: none; border-radius: 8px; font-weight: 600; font-size: 14px;">
    Manage Subscription
  </a>
</div>

<p style="margin: 0; color: #71717a; font-size: 13px; text-align: center;">
  Your clips have been reset for the new billing period. Happy clipping!
</p>
