version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - npm install -g pnpm
            - cd .. && pnpm install && cd frontend
        build:
          commands:
            - pnpm run build
            - cd .. && pnpm deploy --filter=frontend --prod deploy
            - cp -r .next ../deploy/.next
            - cp -r public ../deploy/public || true
      artifacts:
        baseDirectory: ../deploy
        files:
          - '**/*'
      cache:
        paths:
          - ../node_modules/**/*
          - node_modules/**/*
          - .next/cache/**/*
