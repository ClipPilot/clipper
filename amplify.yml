version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - cd ../packages/shared-types && npx openapi-typescript openapi.json -o src/generated/api.ts && node scripts/generate-models.js && npx tsc
            - cd ../packages/shared-ui && npm install --prefix . && npx tsc
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
