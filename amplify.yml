version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - npm install -g pnpm
            - cd .. && pnpm install
        build:
          commands:
            - pnpm run build
            - cp -rL ../node_modules ./node_modules
      artifacts:
        baseDirectory: .
        files:
          - .next/**/*
          - node_modules/**/*
          - package.json
          - public/**/*
      cache:
        paths:
          - ../node_modules/**/*
          - .next/cache/**/*
