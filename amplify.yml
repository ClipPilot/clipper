version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - npm install -g pnpm
            - cd .. && pnpm install && cd frontend
        build:
          commands:
            - pnpm run build
            - mkdir -p .next/standalone/.next
            - cp -r .next/static .next/standalone/.next/static || true
            - cp -r public .next/standalone/public || true
      artifacts:
        baseDirectory: .next/standalone
        files:
          - '**/*'
      cache:
        paths:
          - ../node_modules/**/*
          - node_modules/**/*
          - .next/cache/**/*
