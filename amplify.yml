version: 1
applications:
  - frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - echo "node-linker=hoisted" > .npmrc
            - npm install -g pnpm
            - pnpm install --no-frozen-lockfile
        build:
          commands:
            - pnpm --filter @clipper/frontend build
      artifacts:
        baseDirectory: frontend/.next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - frontend/node_modules/**/*
          - frontend/.next/cache/**/*
    appRoot: frontend
