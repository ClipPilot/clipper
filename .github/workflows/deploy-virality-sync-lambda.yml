name: Deploy Virality Sync Lambda (Production)

on:
  push:
    branches:
      - main
    paths:
      - "lambda-virality-sync/**"
      - "packages/shared-db/**"
      - ".github/workflows/deploy-virality-sync-lambda.yml"
  workflow_dispatch:

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: clipster-virality-sync-lambda
  LAMBDA_ORCHESTRATOR: clipster-virality-sync-orchestrator-prod
  LAMBDA_WORKER: clipster-virality-sync-worker-prod
  LAMBDA_EXTRACTOR: clipster-virality-sync-extractor-prod
  LAMBDA_REPORTER: clipster-virality-sync-reporter-prod

jobs:
  deploy:
    name: Deploy Virality Sync Lambda (Production)
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --provenance=false -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -f lambda-virality-sync/Dockerfile .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Update Lambda functions
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.LAMBDA_ORCHESTRATOR }} \
            --image-uri ${{ steps.build-image.outputs.image }} &
          aws lambda update-function-code \
            --function-name ${{ env.LAMBDA_WORKER }} \
            --image-uri ${{ steps.build-image.outputs.image }} &
          aws lambda update-function-code \
            --function-name ${{ env.LAMBDA_EXTRACTOR }} \
            --image-uri ${{ steps.build-image.outputs.image }} &
          aws lambda update-function-code \
            --function-name ${{ env.LAMBDA_REPORTER }} \
            --image-uri ${{ steps.build-image.outputs.image }} &
          wait

      - name: Wait for Lambda updates
        run: |
          aws lambda wait function-updated \
            --function-name ${{ env.LAMBDA_ORCHESTRATOR }} &
          aws lambda wait function-updated \
            --function-name ${{ env.LAMBDA_WORKER }} &
          aws lambda wait function-updated \
            --function-name ${{ env.LAMBDA_EXTRACTOR }} &
          aws lambda wait function-updated \
            --function-name ${{ env.LAMBDA_REPORTER }} &
          wait

      - name: Verify deployment
        run: |
          echo "Virality Sync Lambda (Production) deployment completed!"
          echo "Orchestrator: ${{ env.LAMBDA_ORCHESTRATOR }}"
          echo "Worker: ${{ env.LAMBDA_WORKER }}"
          echo "Extractor: ${{ env.LAMBDA_EXTRACTOR }}"
          echo "Reporter: ${{ env.LAMBDA_REPORTER }}"
          echo "Image: ${{ steps.build-image.outputs.image }}"
