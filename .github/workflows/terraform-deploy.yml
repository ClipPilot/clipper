name: Terraform Deploy Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - "infra/**"
      - ".github/workflows/terraform-deploy.yml"
  pull_request:
    branches:
      - main
    paths:
      - "infra/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  AWS_REGION: us-west-2
  TF_VERSION: 1.6.0

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: ./infra

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        run: terraform init -backend-config="key=prod/terraform.tfstate"

      - name: Terraform Validate
        run: terraform validate

      - name: Create terraform.tfvars from secrets
        run: |
          cat > terraform.tfvars <<EOF
          aws_region          = "${{ env.AWS_REGION }}"
          environment         = "prod"
          node_env            = "production"
          project_name        = "clipster"

          # Backend Configuration
          backend_container_port = 3001
          backend_cpu            = 2048
          backend_memory         = 4096
          backend_desired_count  = 2

          # Worker Configuration
          worker_cpu             = 8192
          worker_memory          = 16384

          # Secrets
          openai_api_key     = "${{ secrets.OPENAI_API_KEY }}"
          deepgram_api_key   = "${{ secrets.DEEPGRAM_API_KEY }}"
          database_url       = "${{ secrets.DATABASE_URL }}"
          supabase_url       = "${{ secrets.SUPABASE_URL }}"
          supabase_anon_key  = "${{ secrets.SUPABASE_ANON_KEY }}"
          resend_api_key    = "${{ secrets.RESEND_API_KEY }}"

          # Stripe
          stripe_secret_key     = "${{ secrets.STRIPE_SECRET_KEY }}"
          stripe_webhook_secret = "${{ secrets.STRIPE_WEBHOOK_SECRET }}"

          # GitHub
          github_repository   = "${{ github.repository }}"
          github_access_token = "${{ secrets.GH_PAT }}"
          gemini_api_key      = "${{ secrets.GEMINI_API_KEY }}"
          amplify_branch      = "main"

          # Admin
          admin_jwt_secret    = "${{ secrets.ADMIN_JWT_SECRET }}"

          # Sync
          sync_key            = "${{ secrets.SYNC_KEY }}"

          #Video Gen Keys
          elevenlabs_api_key = "${{ secrets.ELEVENLABS_API_KEY }}"
          fal_key            = "${{ secrets.FAL_KEY }}"
          apify_api_token    = "${{ secrets.APIFY_API_TOKEN }}"

          # Ad Posting
          ad_posting_webhook_secret = "${{ secrets.AD_POSTING_WEBHOOK_SECRET }}"

          # Custom Domain
          api_domain          = "api.cuttr.com"
          frontend_url        = "https://platform.cuttr.com"

          # Status Dashboard
          status_cron_secret  = "${{ secrets.STATUS_CRON_SECRET }}"
          EOF

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -out=tfplan
        continue-on-error: true

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infra/tfplan
          retention-days: 5

      - name: Comment PR with Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Plan 📖

            <details><summary>Show Plan</summary>

            \`\`\`terraform
            ${{ steps.plan.outputs.stdout }}
            \`\`\`

            </details>

            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: |
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      github.event_name == 'workflow_dispatch'
    environment:
      name: production
      url: ${{ steps.outputs.outputs.amplify_url }}
    defaults:
      run:
        working-directory: ./infra

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -backend-config="key=prod/terraform.tfstate"

      - name: Create terraform.tfvars from secrets
        run: |
          cat > terraform.tfvars <<EOF
          aws_region          = "${{ env.AWS_REGION }}"
          environment         = "prod"
          node_env            = "production"
          project_name        = "clipster"

          # Backend Configuration
          backend_container_port = 3001
          backend_cpu            = 2048
          backend_memory         = 4096
          backend_desired_count  = 2

          # Worker Configuration
          worker_cpu             = 8192
          worker_memory          = 16384

          # Secrets
          openai_api_key     = "${{ secrets.OPENAI_API_KEY }}"
          deepgram_api_key   = "${{ secrets.DEEPGRAM_API_KEY }}"
          database_url       = "${{ secrets.DATABASE_URL }}"
          supabase_url       = "${{ secrets.SUPABASE_URL }}"
          supabase_anon_key  = "${{ secrets.SUPABASE_ANON_KEY }}"
          resend_api_key     = "${{ secrets.RESEND_API_KEY }}"

          # Stripe
          stripe_secret_key     = "${{ secrets.STRIPE_SECRET_KEY }}"
          stripe_webhook_secret = "${{ secrets.STRIPE_WEBHOOK_SECRET }}"

          # GitHub
          github_repository   = "${{ github.repository }}"
          github_access_token = "${{ secrets.GH_PAT }}"
          gemini_api_key      = "${{ secrets.GEMINI_API_KEY }}"
          amplify_branch      = "main"

          # Admin
          admin_jwt_secret    = "${{ secrets.ADMIN_JWT_SECRET }}"

          # Sync
          sync_key            = "${{ secrets.SYNC_KEY }}"

          # Video Gen Keys
          elevenlabs_api_key = "${{ secrets.ELEVENLABS_API_KEY }}"
          fal_key            = "${{ secrets.FAL_KEY }}"
          apify_api_token    = "${{ secrets.APIFY_API_TOKEN }}"

          # Ad Posting
          ad_posting_webhook_secret = "${{ secrets.AD_POSTING_WEBHOOK_SECRET }}"

          # Custom Domain
          api_domain          = "api.cuttr.com"
          frontend_url        = "https://platform.cuttr.com"

          # Status Dashboard
          status_cron_secret  = "${{ secrets.STATUS_CRON_SECRET }}"
          EOF

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: infra/

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Get Terraform Outputs
        id: outputs
        run: |
          echo "ecr_url=$(terraform output -raw ecr_repository_url)" >> $GITHUB_OUTPUT
          echo "alb_dns=$(terraform output -raw alb_dns_name)" >> $GITHUB_OUTPUT
          echo "amplify_url=$(terraform output -raw amplify_app_url)" >> $GITHUB_OUTPUT
          echo "s3_bucket=$(terraform output -raw s3_bucket_name)" >> $GITHUB_OUTPUT
          echo "backend_api_url=$(terraform output -raw backend_api_url)" >> $GITHUB_OUTPUT

      - name: Display Deployment Info
        run: |
          echo "🎉 Infrastructure deployed successfully!"
          echo "================================"
          echo "Backend API: ${{ steps.outputs.outputs.backend_api_url }}"
          echo "Frontend URL: ${{ steps.outputs.outputs.amplify_url }}"
          echo "S3 Bucket: ${{ steps.outputs.outputs.s3_bucket }}"
          echo "================================"

      - name: Display DNS Configuration (First time setup)
        run: |
          echo ""
          echo "🌐 DNS CONFIGURATION FOR GODADDY"
          echo "================================"
          echo ""
          echo "📋 Certificate Validation Record (add this FIRST):"
          terraform output -json certificate_validation_records
          echo ""
          echo "📋 Domain CNAME Record (add after certificate validates):"
          terraform output -json api_domain_cname
          echo ""
          echo "================================"
          echo "After adding DNS records, wait 5-10 mins for validation."
          echo "Then test: curl https://api.cuttr.com/health"
          echo "================================"
