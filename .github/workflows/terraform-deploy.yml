name: Terraform Deploy Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - "infra/**"
      - ".github/workflows/terraform-deploy.yml"

  pull_request:
    branches:
      - main
    paths:
      - "infra/**"

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  AWS_REGION: us-west-2
  TF_VERSION: 1.6.0

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    # ✅ FIX: PR → preview, main → production
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}

    defaults:
      run:
        working-directory: ./infra

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        run: terraform init -backend-config="key=prod/terraform.tfstate"

      - name: Terraform Validate
        run: terraform validate

      - name: Create terraform.tfvars from secrets
        run: |
          cat > terraform.tfvars <<EOF
          aws_region          = "${{ env.AWS_REGION }}"
          environment         = "prod"
          node_env            = "production"
          project_name        = "clipster"

          backend_container_port = 3001
          backend_cpu            = 2048
          backend_memory         = 4096
          backend_desired_count  = 2

          worker_cpu             = 4096
          worker_memory          = 8192

          openai_api_key     = "${{ secrets.OPENAI_API_KEY }}"
          deepgram_api_key   = "${{ secrets.DEEPGRAM_API_KEY }}"
          database_url       = "${{ secrets.DATABASE_URL }}"
          supabase_url       = "${{ secrets.SUPABASE_URL }}"
          supabase_anon_key  = "${{ secrets.SUPABASE_ANON_KEY }}"
          resend_api_key     = "${{ secrets.RESEND_API_KEY }}"

          stripe_secret_key     = "${{ secrets.STRIPE_SECRET_KEY }}"
          stripe_webhook_secret = "${{ secrets.STRIPE_WEBHOOK_SECRET }}"

          github_repository   = "${{ github.repository }}"
          github_access_token = "${{ secrets.GH_PAT }}"
          gemini_api_key      = "${{ secrets.GEMINI_API_KEY }}"
          amplify_branch      = "main"

          admin_jwt_secret    = "${{ secrets.ADMIN_JWT_SECRET }}"
          sync_key            = "${{ secrets.SYNC_KEY }}"

          elevenlabs_api_key = "${{ secrets.ELEVENLABS_API_KEY }}"
          fal_key            = "${{ secrets.FAL_KEY }}"
          wavespeed_key      = "${{ secrets.WAVESPEED_KEY }}"
          apify_api_token    = "${{ secrets.APIFY_API_TOKEN }}"
          socialdata_api_key = "${{ secrets.SOCIALDATA_API_KEY }}"

          tavily_api_key     = "${{ secrets.TAVILY_API_KEY }}"
          internal_api_key   = "${{ secrets.INTERNAL_API_KEY }}"

          google_service_account_email       = "${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}"
          google_service_account_private_key = "${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}"
          google_drive_parent_folder_id      = "${{ secrets.GOOGLE_DRIVE_PARENT_FOLDER_ID }}"
          ad_posting_webhook_secret          = "${{ secrets.AD_POSTING_WEBHOOK_SECRET }}"

          api_domain          = "api.cuttr.com"
          frontend_url        = "https://platform.cuttr.com"

          status_cron_secret  = "${{ secrets.STATUS_CRON_SECRET }}"
          status_domain       = "status.cuttr.com"

          mac_renderer_url   = "${{ secrets.MAC_RENDERER_URL }}"
          EOF

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -out=tfplan

      # ✅ Save readable plan for PR comment
      - name: Terraform Show Plan
        id: show
        run: terraform show -no-color tfplan > plan.txt

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infra/tfplan
          retention-days: 5

      - name: Upload Terraform Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tf-build
          path: infra/.build/
          retention-days: 5

      # ✅ CLEAN PR DIFF COMMENT
      - name: Comment PR with Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/plan.txt', 'utf8');

            const body = `## 🧠 Terraform Plan

            <details><summary>Click to expand</summary>

            \`\`\`terraform
            ${plan.substring(0, 65000)}
            \`\`\`

            </details>

            _Triggered by @${{ github.actor }}_`;

            github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body
            });

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform-plan

    if: |
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      github.event_name == 'workflow_dispatch'

    environment:
      name: production
      url: ${{ steps.outputs.outputs.amplify_url }}

    defaults:
      run:
        working-directory: ./infra

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -backend-config="key=prod/terraform.tfstate"

      - name: Create terraform.tfvars from secrets
        run: |
          cat > terraform.tfvars <<EOF
          aws_region          = "${{ env.AWS_REGION }}"
          environment         = "prod"
          node_env            = "production"
          project_name        = "clipster"

          backend_container_port = 3001
          backend_cpu            = 2048
          backend_memory         = 4096
          backend_desired_count  = 2

          worker_cpu             = 4096
          worker_memory          = 8192

          openai_api_key     = "${{ secrets.OPENAI_API_KEY }}"
          deepgram_api_key   = "${{ secrets.DEEPGRAM_API_KEY }}"
          database_url       = "${{ secrets.DATABASE_URL }}"
          supabase_url       = "${{ secrets.SUPABASE_URL }}"
          supabase_anon_key  = "${{ secrets.SUPABASE_ANON_KEY }}"
          resend_api_key     = "${{ secrets.RESEND_API_KEY }}"

          stripe_secret_key     = "${{ secrets.STRIPE_SECRET_KEY }}"
          stripe_webhook_secret = "${{ secrets.STRIPE_WEBHOOK_SECRET }}"

          github_repository   = "${{ github.repository }}"
          github_access_token = "${{ secrets.GH_PAT }}"
          gemini_api_key      = "${{ secrets.GEMINI_API_KEY }}"
          amplify_branch      = "main"

          admin_jwt_secret    = "${{ secrets.ADMIN_JWT_SECRET }}"
          sync_key            = "${{ secrets.SYNC_KEY }}"

          elevenlabs_api_key = "${{ secrets.ELEVENLABS_API_KEY }}"
          fal_key            = "${{ secrets.FAL_KEY }}"
          wavespeed_key      = "${{ secrets.WAVESPEED_KEY }}"
          apify_api_token    = "${{ secrets.APIFY_API_TOKEN }}"
          socialdata_api_key = "${{ secrets.SOCIALDATA_API_KEY }}"

          tavily_api_key     = "${{ secrets.TAVILY_API_KEY }}"
          internal_api_key   = "${{ secrets.INTERNAL_API_KEY }}"

          google_service_account_email       = "${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}"
          google_service_account_private_key = "${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}"
          google_drive_parent_folder_id      = "${{ secrets.GOOGLE_DRIVE_PARENT_FOLDER_ID }}"
          ad_posting_webhook_secret          = "${{ secrets.AD_POSTING_WEBHOOK_SECRET }}"

          api_domain          = "api.cuttr.com"
          frontend_url        = "https://platform.cuttr.com"

          status_cron_secret  = "${{ secrets.STATUS_CRON_SECRET }}"
          status_domain       = "status.cuttr.com"

          mac_renderer_url   = "${{ secrets.MAC_RENDERER_URL }}"
          EOF

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: infra/

      - name: Download Terraform Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: tf-build
          path: infra/.build/
        continue-on-error: true

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan