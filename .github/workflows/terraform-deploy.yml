name: Terraform Deploy Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - '.github/workflows/terraform-deploy.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'infra/**'
  workflow_dispatch:

env:
  AWS_REGION: us-west-2
  TF_VERSION: 1.6.0

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: ./infra

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Create terraform.tfvars from secrets
        run: |
          cat > terraform.tfvars <<EOF
          aws_region          = "${{ env.AWS_REGION }}"
          environment         = "prod"
          project_name        = "clipster"

          # Backend Configuration
          backend_container_port = 3001
          backend_cpu            = 2048
          backend_memory         = 4096
          backend_desired_count  = 2

          # Secrets
          openai_api_key     = "${{ secrets.OPENAI_API_KEY }}"
          deepgram_api_key   = "${{ secrets.DEEPGRAM_API_KEY }}"
          database_url       = "${{ secrets.DATABASE_URL }}"
          supabase_url       = "${{ secrets.SUPABASE_URL }}"
          supabase_anon_key  = "${{ secrets.SUPABASE_ANON_KEY }}"

          # GitHub
          github_repository   = "${{ github.repository }}"
          github_access_token = "${{ secrets.GH_PAT }}"
          amplify_branch      = "main"
          EOF

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -out=tfplan
        continue-on-error: true

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infra/tfplan
          retention-days: 5

      - name: Comment PR with Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Plan 📖

            <details><summary>Show Plan</summary>

            \`\`\`terraform
            ${{ steps.plan.outputs.stdout }}
            \`\`\`

            </details>

            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: ${{ steps.outputs.outputs.amplify_url }}
    defaults:
      run:
        working-directory: ./infra

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init

      - name: Create terraform.tfvars from secrets
        run: |
          cat > terraform.tfvars <<EOF
          aws_region          = "${{ env.AWS_REGION }}"
          environment         = "prod"
          project_name        = "clipster"

          # Backend Configuration
          backend_container_port = 3001
          backend_cpu            = 2048
          backend_memory         = 4096
          backend_desired_count  = 2

          # Secrets
          openai_api_key     = "${{ secrets.OPENAI_API_KEY }}"
          deepgram_api_key   = "${{ secrets.DEEPGRAM_API_KEY }}"
          database_url       = "${{ secrets.DATABASE_URL }}"
          supabase_url       = "${{ secrets.SUPABASE_URL }}"
          supabase_anon_key  = "${{ secrets.SUPABASE_ANON_KEY }}"

          # GitHub
          github_repository   = "${{ github.repository }}"
          github_access_token = "${{ secrets.GH_PAT }}"
          amplify_branch      = "main"
          EOF

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: infra/

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Get Terraform Outputs
        id: outputs
        run: |
          echo "ecr_url=$(terraform output -raw ecr_repository_url)" >> $GITHUB_OUTPUT
          echo "alb_dns=$(terraform output -raw alb_dns_name)" >> $GITHUB_OUTPUT
          echo "amplify_url=$(terraform output -raw amplify_app_url)" >> $GITHUB_OUTPUT
          echo "s3_bucket=$(terraform output -raw s3_bucket_name)" >> $GITHUB_OUTPUT

      - name: Display Deployment Info
        run: |
          echo "🎉 Infrastructure deployed successfully!"
          echo "================================"
          echo "Backend API: https://${{ steps.outputs.outputs.alb_dns }}/api"
          echo "Frontend URL: ${{ steps.outputs.outputs.amplify_url }}"
          echo "S3 Bucket: ${{ steps.outputs.outputs.s3_bucket }}"
          echo "================================"
