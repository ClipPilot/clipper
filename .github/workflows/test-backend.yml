name: Test Backend

on:
  pull_request:
    branches: [main, staging]
    paths:
      - 'backend/**'
      - 'packages/shared-db/**'
      - 'packages/shared-email/**'
      - '.github/workflows/test-backend.yml'
  push:
    branches: [main, staging]
    paths:
      - 'backend/**'
      - 'packages/shared-db/**'
      - 'packages/shared-email/**'
      - '.github/workflows/test-backend.yml'

jobs:
  test:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm --filter @clipper/shared-db build
          pnpm --filter @clipper/shared-email build

      - name: Run tests
        working-directory: backend
        run: pnpm test
