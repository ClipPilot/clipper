name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Create/Update Release
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GH_PAT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Post release summary
        if: steps.release.outputs.release_created == 'true'
        run: |
          echo "## Release ${{ steps.release.outputs.tag_name }} created!" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.release.outputs.version }}" >> $GITHUB_STEP_SUMMARY

  tag-pending-releases:
    name: Tag Pending Release PRs
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.release_created != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find and tag pending release PRs
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          PENDING_PR=$(gh pr list --state merged --label "autorelease: pending" --json number,title,mergeCommit --jq '.[0]')
          if [[ -z "$PENDING_PR" || "$PENDING_PR" == "null" ]]; then
            echo "No pending release PRs found"
            exit 0
          fi

          PR_NUMBER=$(echo "$PENDING_PR" | jq -r '.number')
          MERGE_SHA=$(echo "$PENDING_PR" | jq -r '.mergeCommit.oid')

          VERSION=$(cat package.json | jq -r '.version')
          TAG="v${VERSION}"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, just fixing label"
          else
            echo "Creating tag $TAG at $MERGE_SHA"
            git tag "$TAG" "$MERGE_SHA"
            git push origin "$TAG"

            echo "Creating GitHub Release"
            gh release create "$TAG" --title "$TAG" --generate-notes --target main
          fi

          echo "Updating PR #${PR_NUMBER} label"
          gh pr edit "$PR_NUMBER" --remove-label "autorelease: pending" --add-label "autorelease: tagged"
          echo "Done! Tagged $TAG for PR #${PR_NUMBER}"

          echo "Triggering CI/CD deploy for tag $TAG"
          gh workflow run ci.yml --ref "$TAG"
