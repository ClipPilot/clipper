name: Database Migrations

on:
  push:
    branches:
      - staging
      - main
    paths:
      - 'packages/shared-db/drizzle/**'
      - '.github/workflows/db-migrate.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to migrate'
        required: true
        type: choice
        options:
          - staging
          - production

jobs:
  migrate:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'production' || 'staging') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up PNPM
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Install shared-db dependencies
        run: pnpm install --filter @clipper/shared-db

      - name: Run migrations
        env:
          ENV: ${{ github.event_name == 'workflow_dispatch' && (inputs.environment == 'production' && 'prod' || 'staging') || (github.ref_name == 'main' && 'prod' || 'staging') }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          PROD_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        working-directory: packages/shared-db
        run: pnpm db:migrate

      - name: Migration result
        run: |
          echo "Migrations applied successfully!"
          echo "Environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'production' || 'staging') }}"
          echo "Branch: ${{ github.ref_name }}"
